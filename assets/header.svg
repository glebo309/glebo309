<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Glenn Bojanov</title>
  <desc id="desc">Biocatalysis, scientific software, and creative systems</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081018"/>
      <stop offset="0.6" stop-color="#0d1720"/>
      <stop offset="1" stop-color="#10242a"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55d6be"/>
      <stop offset="1" stop-color="#d3f36b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#55d6be" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#55d6be" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="22" fill="url(#background)"/>
  <rect width="1200" height="330" rx="22" fill="url(#grid)"/>
  <circle cx="1000" cy="100" r="240" fill="url(#glow)"/>

  <g opacity="0.22" fill="none" stroke="#55d6be">
    <path d="M850 244C900 244 896 176 938 176s41 87 84 87 39-92 82-92 43 53 86 53"/>
    <path d="M850 259C899 259 899 198 940 198s38 51 80 51 44-69 86-69 40 36 83 36" opacity="0.5"/>
  </g>

  <g stroke="#55d6be" stroke-width="2" fill="#0d1720">
    <path d="M888 87 946 53 1004 87v68l-58 34-58-34z"/>
    <path d="M1004 87 1062 53 1120 87v68l-58 34-58-34z"/>
    <circle cx="888" cy="87" r="7" fill="#55d6be" stroke="none"/>
    <circle cx="946" cy="53" r="7" fill="#d3f36b" stroke="none"/>
    <circle cx="1004" cy="87" r="7" fill="#55d6be" stroke="none"/>
    <circle cx="1004" cy="155" r="7" fill="#d3f36b" stroke="none"/>
    <circle cx="1062" cy="53" r="7" fill="#55d6be" stroke="none"/>
    <circle cx="1120" cy="87" r="7" fill="#d3f36b" stroke="none"/>
    <circle cx="1120" cy="155" r="7" fill="#55d6be" stroke="none"/>
  </g>

  <g fill="#55d6be" filter="url(#softGlow)" opacity="0.3">
    <circle cx="888" cy="87" r="10"/>
    <circle cx="1004" cy="155" r="10"/>
    <circle cx="1120" cy="155" r="10"/>
  </g>

  <rect x="70" y="72" width="62" height="4" rx="2" fill="url(#signal)"/>
  <text x="70" y="145" fill="#f3f7f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="1">GLENN BOJANOV</text>
  <text x="73" y="195" fill="#9eacb3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="2.4">BIOCATALYSIS  ×  SCIENTIFIC SOFTWARE</text>
  <text x="73" y="233" fill="#9eacb3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="2.4">CREATIVE SYSTEMS</text>
  <circle cx="74" cy="277" r="4" fill="#d3f36b"/>
  <text x="90" y="283" fill="#55d6be" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1.2">BERN, SWITZERLAND</text>
